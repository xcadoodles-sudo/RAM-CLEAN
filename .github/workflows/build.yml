name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak project
        run: unzip -q .github/workflows/ramclean.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build
        run: gradle assembleDebug --no-daemon
        working-directory: ramclean

      - uses: actions/upload-artifact@v4
        with:
          name: ram-clean-debug
          path: ramclean/app/build/outputs/apk/debug/*.apk
